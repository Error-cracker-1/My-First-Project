{% extends "layout.html" %}
{% block content %}
{% if dashboard_exists %}
  <div class="dashboard-wrapper" style="width: 100%;">
    {{ dashboard_content | safe }}
  </div>
{% else %}
  <div class="card" style="text-align: center; padding: 48px 24px; margin-top: 24px;">
    <h3>No Dashboard Generated Yet</h3>
    <p style="color: var(--muted);">Run an AI review from the Home page to generate your interactive repository dashboard.</p>
    <a href="/" class="btn primary" style="margin-top: 12px; display: inline-block;">Go to Home</a>
  </div>
{% endif %}
{% endblock %}
