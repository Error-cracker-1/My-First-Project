name: Code Coverage Agent

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:
    inputs:
      enable_copilot:
        description: Allow one bounded Copilot CLI test-improvement request
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  code-quality: write
  copilot-requests: write

concurrency:
  group: coverage-agent-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Test, measure, and optionally improve coverage
    runs-on: ubuntu-latest
    outputs:
      testable: ${{ steps.detect.outputs.testable }}
      initial: ${{ steps.initial.outputs.percent }}
      final: ${{ steps.final.outputs.percent }}
      ai_used: ${{ steps.final.outputs.ai_used }}
      ai_requests: ${{ steps.final.outputs.ai_requests }}
      tests: ${{ steps.final.outputs.tests }}
      files_changed: ${{ steps.final.outputs.files_changed }}
      failures: ${{ steps.final.outputs.failures }}
    steps:
      - name: Check out PR head or manual commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml
            **/setup.cfg
            **/setup.py

      - name: Detect Python project and changed source
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          excluded='(^|/)(vendor|node_modules|\.venv|\.git|build|dist|coverage|\.cache|__pycache__|target|out|generated)(/|$)'
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then base="$(git rev-parse HEAD^)"; fi
          git diff --name-only "$base" HEAD | grep -Ev "$excluded" > "$RUNNER_TEMP/coverage-changed.txt" || true
          if ! find . -path './.git' -prune -o -path './.venv' -prune -o -path './node_modules' -prune -o -type f -name '*.py' -print -quit | grep -q .; then
            echo 'testable=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ '${{ github.event_name }}' = 'pull_request' ] && [ ! -s "$RUNNER_TEMP/coverage-changed.txt" ]; then
            echo 'testable=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'testable=true' >> "$GITHUB_OUTPUT"

      - name: Install project dependencies and coverage tooling
        if: steps.detect.outputs.testable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install --disable-pip-version-check -r requirements.txt; fi
          if [ -f pyproject.toml ] || [ -f setup.cfg ] || [ -f setup.py ]; then python -m pip install --disable-pip-version-check .; fi
          python -m pip install --disable-pip-version-check coverage pytest

      - name: Run the existing test suite with line coverage
        if: steps.detect.outputs.testable == 'true'
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/coverage-agent"; mkdir -p "$root"; : > "$root/tests.txt"
          if find . -path './.git' -prune -o -path './.venv' -prune -o -path './node_modules' -prune -o -path './coverage' -prune -o -type f \( -name 'test_*.py' -o -name '*_test.py' -o -name 'tests.py' \) -print -quit | grep -q .; then
            echo 'pytest' | tee -a "$root/tests.txt"
            python -m coverage erase
            python -m coverage run --source=Python -m pytest
          else
            echo 'No Python test suite was found.' | tee -a "$root/tests.txt"
            exit 1
          fi
          python -m coverage json -o "$root/coverage.json"
          python -m coverage xml -o "$root/coverage.xml"
          python -m coverage report

      - name: Upload coverage to GitHub Code Quality
        if: steps.detect.outputs.testable == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-code-coverage@v1
        with:
          file: ${{ runner.temp }}/coverage-agent/coverage.xml
          language: python
          label: python

      - name: Summarize initial coverage and select the highest-value target
        if: steps.detect.outputs.testable == 'true'
        id: initial
        shell: bash
        env:
          CHANGED_FILE: ${{ runner.temp }}/coverage-changed.txt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'coverage-agent'
          data = json.loads((root / 'coverage.json').read_text(encoding='utf-8'))
          totals = data.get('totals', {})
          covered = int(totals.get('covered_lines', 0)); total = int(totals.get('num_statements', 0))
          percent = round(100 * covered / total, 2) if total else 'n/a'
          changed = set(Path(os.environ['CHANGED_FILE']).read_text().splitlines()) if Path(os.environ['CHANGED_FILE']).exists() else set()
          candidates=[]
          for name,item in data.get('files',{}).items():
              missing=item.get('missing_lines',[])
              if missing:
                  normalized=name.replace('\\','/')
                  candidates.append((0 if normalized in changed else 1,-len(missing),normalized,missing[:30]))
          candidates.sort()
          if candidates:
              _,_,name,missing=candidates[0]
              (root/'target.txt').write_text(name+'\n',encoding='utf-8')
              detail=f'- `{name}`: {len(missing)} uncovered lines (examples: {", ".join(map(str,missing))})'
          else:
              (root/'target.txt').write_text('',encoding='utf-8'); detail='- No uncovered executable lines were found.'
          (root/'report.md').write_text(f'# Code Coverage Agent\n\nInitial line coverage: **{percent}%**\n\nHighest-value target:\n{detail}\n',encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out: out.write(f'percent={percent}\n')
          PY
          cat "$RUNNER_TEMP/coverage-agent/report.md"

      - name: Decide whether one AI request is permitted
        if: steps.detect.outputs.testable == 'true'
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          allowed=false
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] && [ '${{ inputs.enable_copilot }}' = 'true' ]; then allowed=true; fi
          if [ '${{ github.event_name }}' = 'pull_request' ] && [ '${{ contains(github.event.pull_request.labels.*.name, 'coverage-agent') }}' = 'true' ] && [ '${{ github.event.pull_request.head.repo.fork }}' = 'false' ]; then allowed=true; fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      - name: Install and invoke Copilot CLI once for a test-only patch
        if: steps.policy.outputs.allowed == 'true'
        id: copilot
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=$(head -1 "$RUNNER_TEMP/coverage-agent/target.txt" || true); [ -n "$target" ] || exit 0; test -f "$target"
          npm install --global @github/copilot
          test_excerpt=$(find "$(dirname "$target")" -maxdepth 3 -type f \( -name 'test_*.py' -o -name '*_test.py' -o -name 'tests.py' -o -name '*.spec.js' -o -name '*.test.js' -o -name '*.spec.ts' -o -name '*.test.ts' \) -print -quit 2>/dev/null || true)
          {
            cat .github/copilot-instructions.md
            printf '\n\nCoverage report:\n'; cat "$RUNNER_TEMP/coverage-agent/report.md"
            printf '\n\nSelected target: %s\n\nSource excerpt:\n' "$target"; sed -n '1,320p' "$target"
            if [ -n "$test_excerpt" ] && [ -f "$test_excerpt" ]; then printf '\n\nRelevant test excerpt: %s\n' "$test_excerpt"; sed -n '1,320p' "$test_excerpt"; fi
            printf '\n\nReturn only a unified diff. The diff must modify exactly one existing or new test/spec file and must not modify production code, configuration, dependencies, workflows, or generated files.\n'
          } > "$RUNNER_TEMP/copilot-prompt.md"
          mkdir -p "$RUNNER_TEMP/copilot-sandbox"
          (cd "$RUNNER_TEMP/copilot-sandbox" && copilot -p "$(cat "$RUNNER_TEMP/copilot-prompt.md")") > "$RUNNER_TEMP/copilot.patch"
          test -s "$RUNNER_TEMP/copilot.patch"
          git apply --check "$RUNNER_TEMP/copilot.patch"
          changed=$(git apply --numstat "$RUNNER_TEMP/copilot.patch" | cut -f3); [ -n "$changed" ]; [ "$(printf '%s\n' "$changed" | wc -l | tr -d ' ')" -eq 1 ]
          printf '%s\n' "$changed" | grep -Eq '(^|/)(test|tests|spec)(/|$)|(^|/)(test_[^/]*|[^/]*_test|tests|[^/]*\.spec|[^/]*\.test)\.(py|js|jsx|ts|tsx|java|kt|go|rs|cs|cpp|c|h|php|rb|swift)$'
          ! printf '%s\n' "$changed" | grep -Eq '(^|/)(\.github|vendor|node_modules|\.venv|\.git|build|dist|coverage|generated)(/|$)|(^|/)(package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|requirements.*\.txt|pyproject\.toml|Cargo\.toml|go\.mod|pom\.xml|build\.gradle(\.kts)?)$'
          git apply "$RUNNER_TEMP/copilot.patch"
          echo 'applied=true' >> "$GITHUB_OUTPUT"

      - name: Re-run tests and regenerate coverage after accepted AI patch
        if: steps.copilot.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m coverage erase
          python -m coverage run --source=Python -m pytest
          python -m coverage json -o "$RUNNER_TEMP/coverage-agent/coverage-final.json"
          python -m coverage xml -o "$RUNNER_TEMP/coverage-agent/coverage-final.xml"
          python -m coverage report

      - name: Calculate final coverage and build diagnostics
        if: always() && steps.detect.outputs.testable == 'true'
        id: final
        shell: bash
        env:
          COPILOT_OUTCOME: ${{ steps.copilot.outcome }}
          CHANGED_FILES: ${{ steps.copilot.outputs.applied == 'true' && 'test-only patch applied' || 'none' }}
          FAILURES: ${{ steps.tests.outcome != 'success' && 'Test suite failed.' || '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'coverage-agent'
          initial=json.loads((root/'coverage.json').read_text(encoding='utf-8'))
          final_path=root/'coverage-final.json'; final=json.loads(final_path.read_text(encoding='utf-8')) if final_path.exists() else initial
          def pct(data):
              t=data.get('totals',{}); c=int(t.get('covered_lines',0)); n=int(t.get('num_statements',0)); return round(100*c/n,2) if n else None
          a=pct(initial); b=pct(final); d=round(b-a,2) if a is not None and b is not None else None
          ai='true' if os.environ.get('COPILOT_OUTCOME')=='success' else 'false'
          tests=(root/'tests.txt').read_text(encoding='utf-8').strip() if (root/'tests.txt').exists() else 'not recorded'
          failures=os.environ.get('FAILURES','')
          report=f'# Code Coverage Agent Report\n\n- Initial line coverage: **{a if a is not None else "n/a"}%**\n- Final line coverage: **{b if b is not None else "n/a"}%**\n- Coverage change: **{d if d is not None else "n/a"}%**\n- AI requests: **{1 if ai=="true" else 0}**\n- AI patch applied: **{ai}**\n- Changed files: **{os.environ.get("CHANGED_FILES") or "none"}**\n\n## Test commands\n\n{tests}\n'
          if failures: report += f'\n## Failures\n\n{failures}\n'
          (root/'final-report.md').write_text(report,encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'percent={b if b is not None else "n/a"}\n'); out.write(f'ai_used={ai}\n'); out.write(f'ai_requests={1 if ai=="true" else 0}\n'); out.write(f'tests={tests.replace(chr(10)," ")}\n'); out.write(f'files_changed={os.environ.get("CHANGED_FILES") or "none"}\n'); out.write(f'failures={failures}\n')
          PY
          cat "$RUNNER_TEMP/coverage-agent/final-report.md"

      - name: Upload agent diagnostics
        if: always() && steps.detect.outputs.testable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-agent-report
          path: ${{ runner.temp }}/coverage-agent
          if-no-files-found: warn
