name: Code Quality Coverage

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# This workflow feeds GitHub Code Quality's native coverage reporting.
# The existing Code Coverage Agent remains responsible for bounded AI-assisted
# test improvements; this workflow is the deterministic coverage source.
permissions:
  contents: read
  code-quality: write

concurrency:
  group: code-quality-coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Generate Cobertura coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head or pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml

      - name: Detect Python project
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if find . \
            -path './.git' -prune -o \
            -path './.venv' -prune -o \
            -path './node_modules' -prune -o \
            -type f \( -name '*.py' -o -name 'requirements.txt' -o -name 'pyproject.toml' -o -name 'setup.cfg' -o -name 'setup.py' \) -print -quit | grep -q .; then
            echo 'python=true' >> "$GITHUB_OUTPUT"
          else
            echo 'python=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install project dependencies and coverage tools
        if: steps.detect.outputs.python == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f requirements.txt ]; then
            python -m pip install --disable-pip-version-check -r requirements.txt
          fi
          if [ -f pyproject.toml ] || [ -f setup.cfg ] || [ -f setup.py ]; then
            python -m pip install --disable-pip-version-check . || true
          fi
          python -m pip install --disable-pip-version-check coverage pytest

      - name: Run tests and generate one canonical Cobertura report
        if: steps.detect.outputs.python == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if find . -path './.git' -prune -o -path './.venv' -prune -o -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            python -m coverage run -m pytest
          else
            python -m coverage run -m unittest discover
          fi
          python -m coverage xml -o coverage.xml

      - name: Upload coverage to GitHub Code Quality
        if: steps.detect.outputs.python == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: python
          label: python
