name: README Generator

on:
  push:
    branches:
      - master
      - feature-1
    paths-ignore:
      - README.md
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-generator-both-branches
  cancel-in-progress: true

jobs:
  generate-readme:
    name: Generate README (${{ matrix.branch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          - master
          - feature-1
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gemini SDK
        run: python -m pip install --disable-pip-version-check google-genai

      - name: Generate README
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TARGET_BRANCH: ${{ matrix.branch }}
          BEFORE_SHA: ${{ matrix.branch == github.ref_name && github.event.before || '' }}
        run: python .github/scripts/generate_readme.py

      - name: Validate README-only change
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != "README.md" ]; then
            echo "ERROR: Only README.md may be changed."
            echo "$changed"
            exit 1
          fi

      - name: Commit and push README
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README is already up to date on ${{ matrix.branch }}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: automatically update README"
          git push origin "HEAD:${{ matrix.branch }}"
