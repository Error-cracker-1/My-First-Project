name: README Generator

on:
  push:
    branches:
      - master
      - feature-1
    paths-ignore:
      - README.md
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-generator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-readme:
    name: Generate README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gemini SDK
        run: python -m pip install --disable-pip-version-check google-genai

      - name: Generate README
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python .github/scripts/generate_readme.py

      - name: Validate README-only change
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != "README.md" ]; then
            echo "ERROR: Only README.md may be changed."
            echo "$changed"
            exit 1
          fi

      - name: Commit and push README
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: automatically update README"
          git push origin "HEAD:${GITHUB_REF_NAME}"
