name: README Generator (AI-Chatbot)

on:
  push:
    branches: ["AI-Chatbot"]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-chatbot-automation
  cancel-in-progress: false

jobs:
  generate:
    name: Generate README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AI-Chatbot
        uses: actions/checkout@v4
        with:
          ref: AI-Chatbot
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Gemini SDK
        run: python -m pip install --disable-pip-version-check --quiet google-genai
      - name: Update README when needed
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TARGET_BRANCH: AI-Chatbot
          BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: python .github/scripts/generate_readme.py
      - name: Validate README-only change
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != "README.md" ]; then
            echo "ERROR: README generator changed files other than README.md:"
            echo "$changed"
            exit 1
          fi
      - name: Commit README if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: automatically update README"
          git push origin HEAD:AI-Chatbot
