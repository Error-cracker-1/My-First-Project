name: README Generator

on:
  push:
    branches:
      - master
      - feature-1
    paths-ignore:
      - README.md
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-generator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-readme:
    name: Analyze repository and update README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Gemini SDK
        run: python -m pip install --disable-pip-version-check google-genai

      - name: Generate README with Gemini
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from google import genai

          root = Path.cwd()
          readme = root / 'README.md'
          instructions = root / '.github' / 'readme-generator-instructions.md'

          excluded_dirs = {
              '.git', '.github', '.venv', 'node_modules', 'vendor', 'build',
              'dist', 'coverage', '__pycache__', '.cache', 'target', 'out', 'generated'
          }
          excluded_files = {
              'README.md', 'AI_CHANGELOG.md', 'Requirements.txt', 'requirements.txt'
          }
          allowed_extensions = {
              '.py', '.html', '.css', '.js', '.ts', '.jsx', '.tsx', '.md', '.txt',
              '.ps1', '.ipynb', '.json', '.yml', '.yaml'
          }

          def read_text(path, limit):
              try:
                  return path.read_text(encoding='utf-8', errors='ignore')[:limit]
              except OSError:
                  return ''

          files = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              relative = path.relative_to(root)
              if any(part in excluded_dirs for part in relative.parts):
                  continue
              if path.name in excluded_files:
                  continue
              if path.suffix.lower() in allowed_extensions:
                  files.append(relative.as_posix())
          files.sort()

          def git_output(args):
              result = subprocess.run(
                  ['git', *args],
                  capture_output=True,
                  text=True,
                  timeout=30,
                  check=False,
              )
              return result.stdout.strip()

          recent_log = git_output(['log', '-8', '--oneline', '--decorate'])

          before = os.environ.get('GITHUB_EVENT_BEFORE', '')
          sha = os.environ.get('GITHUB_SHA', 'HEAD')
          if before and before != '0' * 40:
              diff = git_output(['diff', before, sha, '--', '.', ':!README.md'])
          else:
              diff = git_output(['diff', 'HEAD^', 'HEAD', '--', '.', ':!README.md'])
          diff = diff[:20000]

          manifests = []
          for name in [
              'requirements.txt', 'Requirements.txt', 'pyproject.toml', 'package.json',
              'Cargo.toml', 'go.mod', 'pom.xml', 'build.gradle', 'build.gradle.kts'
          ]:
              path = root / name
              if path.is_file():
                  manifests.append(f'--- {name} ---\n{read_text(path, 10000)}')

          prompt = f'''You are the README maintenance agent for this repository.

Follow these instructions exactly:
{read_text(instructions, 12000)}

CURRENT README:
{read_text(readme, 30000)}

REPOSITORY FILE LIST:
{chr(10).join(files[:300])}

PROJECT MANIFESTS:
{chr(10).join(manifests)}

RECENT COMMITS:
{recent_log}

CHANGES SINCE THE TRIGGERING COMMIT:
{diff}

Generate the complete updated README.md. Use only verified information supplied above.
Preserve useful existing content and valid badges. Do not invent anything.
Return ONLY the README contents, with no Markdown fence and no explanation.'''

          api_key = os.environ.get('GOOGLE_API_KEY')
          if not api_key:
              raise SystemExit('GOOGLE_API_KEY is missing from repository secrets.')

          client = genai.Client(api_key=api_key)
          response = client.models.generate_content(
              model='gemini-2.5-flash',
              contents=prompt,
          )

          generated = (response.text or '').strip()
          if generated.startswith('```'):
              generated = generated.split('\n', 1)[1] if '\n' in generated else ''
              if generated.endswith('```'):
                  generated = generated[:-3].rstrip()

          if len(generated) < 300:
              raise SystemExit('Generated README is suspiciously short; refusing to replace README.')

          readme.write_text(generated + '\n', encoding='utf-8')
          PY

      - name: Validate README-only change
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != "README.md" ]; then
            echo 'ERROR: The generator changed files other than README.md:'
            echo "$changed"
            exit 1
          fi

      - name: Commit and push README when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo 'README is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: automatically update README'
          git push origin "HEAD:${GITHUB_REF_NAME}"
