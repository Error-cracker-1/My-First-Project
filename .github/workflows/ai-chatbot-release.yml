name: AI Chatbot Release Bundle

on:
  push:
    tags:
      - '*.*'

permissions:
  contents: write

concurrency:
  group: ai-chatbot-release
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on AI-Chatbot
        shell: bash
        run: |
          git fetch origin AI-Chatbot --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/AI-Chatbot"; then
            echo "Tag $GITHUB_REF_NAME does not point to a commit contained in AI-Chatbot."
            exit 1
          fi

      - name: Build AI Chatbot runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          BUNDLE_DIR="$RUNNER_TEMP/ai-chatbot-release"
          ROOT="$BUNDLE_DIR/AI-Chatbot-${TAG}"
          ZIP="$BUNDLE_DIR/AI-Chatbot-${TAG}-bundle.zip"
          rm -rf "$BUNDLE_DIR"
          mkdir -p "$ROOT"
          cp app.py config.py conversation_store.py requirements.txt .env.example "$ROOT"/
          ( cd "$BUNDLE_DIR" && zip -qr "$(basename "$ZIP")" "$(basename "$ROOT")" )
          test -f "$ZIP"
          echo "Created: $ZIP"
          unzip -l "$ZIP"

      - name: Save runtime bundle as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: AI-Chatbot-${{ github.ref_name }}-bundle
          path: ${{ runner.temp }}/ai-chatbot-release/AI-Chatbot-${{ github.ref_name }}-bundle.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create or prepare release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IMMUTABLE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.immutable // false')"
            if [[ "$IMMUTABLE" == "true" ]]; then
              echo "Release $TAG is already immutable."
              echo "The runtime bundle was preserved as a workflow artifact instead."
              echo "can_mutate=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG :- AI Chatbot Release" --draft=true
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG :- AI Chatbot Release" --generate-notes --draft
          fi
          echo "can_mutate=true" >> "$GITHUB_OUTPUT"

      - name: Upload AI Chatbot runtime bundle to release
        if: steps.release.outputs.can_mutate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/ai-chatbot-release/AI-Chatbot-$GITHUB_REF_NAME-bundle.zip"
          test -f "$ZIP"
          gh release upload "$GITHUB_REF_NAME" "$ZIP#AI Chatbot runtime bundle" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish release
        if: steps.release.outputs.can_mutate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
