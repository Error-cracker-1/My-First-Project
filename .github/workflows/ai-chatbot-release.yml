name: AI Chatbot Release Bundle

on:
  push:
    tags:
      - '*.*'

permissions:
  contents: write

concurrency:
  group: ai-chatbot-release
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on AI-Chatbot
        shell: bash
        run: |
          git fetch origin AI-Chatbot --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/AI-Chatbot"; then
            echo "Tag $GITHUB_REF_NAME does not point to a commit contained in AI-Chatbot."
            exit 1
          fi

      - name: Build AI Chatbot runtime bundle
        shell: bash
        run: |
          set -euo pipefail

          TAG="$GITHUB_REF_NAME"
          BUNDLE_DIR="$RUNNER_TEMP/ai-chatbot-release"
          ROOT="$BUNDLE_DIR/AI-Chatbot-${TAG}"
          ZIP="$BUNDLE_DIR/AI-Chatbot-${TAG}-bundle.zip"

          rm -rf "$BUNDLE_DIR"
          mkdir -p "$ROOT"

          cp README.md app.py config.py requirements.txt .env.example "$ROOT"/
          (
            cd "$BUNDLE_DIR"
            zip -qr "$(basename "$ZIP")" "$(basename "$ROOT")"
          )

          test -f "$ZIP"
          echo "Created: $ZIP"
          unzip -l "$ZIP"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="$GITHUB_REF_NAME"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating it."
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG :- AI Chatbot Release" \
              --draft=true
          else
            echo "Creating draft release $TAG."
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG :- AI Chatbot Release" \
              --generate-notes \
              --draft
          fi

      - name: Upload AI Chatbot runtime bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$RUNNER_TEMP/ai-chatbot-release/AI-Chatbot-$GITHUB_REF_NAME-bundle.zip"
          test -f "$ZIP"

          gh release upload "$GITHUB_REF_NAME" \
            "$ZIP#AI Chatbot runtime bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
