name: AI Chatbot Release Bundle

on:
  push:
    tags:
      - '[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: ai-chatbot-release
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on AI-Chatbot
        shell: bash
        run: |
          git fetch origin AI-Chatbot --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/AI-Chatbot"; then
            echo "Tag $GITHUB_REF_NAME does not point to a commit contained in AI-Chatbot."
            exit 1
          fi

      - name: Build AI Chatbot runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          BUNDLE_DIR="$RUNNER_TEMP/ai-chatbot-release"
          ROOT="$BUNDLE_DIR/AI-Chatbot-$TAG"
          ZIP="$BUNDLE_DIR/AI-Chatbot-$TAG-bundle.zip"

          rm -rf "$BUNDLE_DIR"
          mkdir -p "$ROOT"

          cp app.py web_app.py config.py conversation_store.py requirements.txt .env.example "$ROOT"/
          cp -R templates static "$ROOT"/

          (
            cd "$BUNDLE_DIR"
            zip -qr "$(basename "$ZIP")" "$(basename "$ROOT")"
          )

          test -f "$ZIP"
          echo "Created: $ZIP"
          unzip -l "$ZIP"

      - name: Save runtime bundle as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: AI-Chatbot-${{ github.ref_name }}-bundle
          path: ${{ runner.temp }}/ai-chatbot-release/AI-Chatbot-${{ github.ref_name }}-bundle.zip
          if-no-files-found: error
          retention-days: 30

      - name: Generate complete AI Chatbot release notes
        shell: bash
        run: |
          set -euo pipefail

          TAG="$GITHUB_REF_NAME"
          NOTES="$RUNNER_TEMP/ai-chatbot-release-notes.md"

          PREVIOUS_TAG="$(git tag --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)"

          if [[ -n "$PREVIOUS_TAG" ]]; then
            CHANGELOG="$(git log --pretty=format:'- %s (%h)' "$PREVIOUS_TAG..$TAG")"
            COMPARE_URL="https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS_TAG...$TAG"
          else
            CHANGELOG="$(git log --pretty=format:'- %s (%h)' "$TAG" -n 30)"
            COMPARE_URL="https://github.com/$GITHUB_REPOSITORY/commits/$TAG"
          fi

          if [[ -z "$CHANGELOG" ]]; then
            CHANGELOG="- No commit messages were found between the release tags."
          fi

          cat > "$NOTES" <<EOF
          # AI Chatbot $TAG

          ## What changed

          This release contains the AI Chatbot changes included in tag **$TAG**.

          ### Changelog

          $CHANGELOG

          **Full comparison:** $COMPARE_URL

          ## How to use

          ### 1. Download the AI Chatbot runtime bundle

          Download **AI-Chatbot-$TAG-bundle.zip** from the Assets section of this release.

          The custom bundle contains only the files required by the AI Chatbot runtime:
          - `app.py` — command-line chatbot application
          - `web_app.py` — browser-based web interface
          - `templates/` — web interface HTML
          - `static/` — web interface CSS and JavaScript
          - `config.py` — environment and model configuration
          - `conversation_store.py` — local conversation save/load support
          - `requirements.txt` — Python dependencies
          - `.env.example` — environment variable template

          It does not include GitHub Actions workflows, repository documentation folders, prompts, scripts, Git history, caches, or saved conversation data.

          ### 2. Extract the bundle

          Extract the ZIP and open a terminal in the extracted `AI-Chatbot-$TAG` folder.

          ### 3. Create a virtual environment

          **Windows:**
          ```text
          py -m venv .venv
          .venv\\Scripts\\activate
          ```

          **Linux/macOS:**
          ```text
          python3 -m venv .venv
          source .venv/bin/activate
          ```

          ### 4. Install dependencies

          ```text
          python -m pip install -r requirements.txt
          ```

          ### 5. Configure Gemini

          Copy `.env.example` to `.env` and set:

          ```text
          GEMINI_API_KEY=your_gemini_api_key_here
          GEMINI_MODEL=gemini-3.5-flash-lite
          GEMINI_MAX_OUTPUT_TOKENS=2048
          CHATBOT_STORAGE_DIR=.chatbot_data/conversations
          ```

          Keep your real API key private. Do not commit `.env` to GitHub.

          ### 6. Start the chatbot

          **Command-line interface:**
          ```text
          python app.py
          ```

          **Web interface:**
          ```text
          python web_app.py
          ```

          Then open `http://127.0.0.1:5000` in your browser.

          ## Chatbot commands

          | Command | Purpose |
          |---|---|
          | `/model` | Select or switch the active Gemini model |
          | `/models` | Open the model manager |
          | `/current` | Show the active model and stored model sessions |
          | `/history` | Show the current conversation history |
          | `/clear` | Clear the current model's conversation |
          | `/save` | Save the current conversation |
          | `/save NAME` | Save using the supplied name |
          | `/load` | Load a saved conversation |
          | `/load NAME` | Load a saved conversation by name |
          | `/saves` | List saved conversations |
          | `/file` | Enter a source/text file path for AI analysis |
          | `/file PATH` | Send the specified source/text file to the AI |
          | `/exit` | Exit the chatbot |

          The chatbot accepts many common programming languages and text/source formats. File input is limited to **512 KB** and UTF-8 text/source files.

          ## Configuration

          The default model is `gemini-3.5-flash-lite`. You can change `GEMINI_MODEL` in `.env` to another model supported by this release.

          `GEMINI_MAX_OUTPUT_TOKENS` controls the maximum generated output length.

          `CHATBOT_STORAGE_DIR` controls where saved conversations are stored locally. Saved conversations are not included in the release bundle.


          ## Command reference

          ### `/model` and `/models`
          Opens the model manager. It shows the active Gemini model, model IDs, and available configured models. You can select a model by number or supported alias. Switching to a model that already has a session restores that session; otherwise a new session is created.

          Example:
          ```text
          You: /model
          ```

          ### `/current`
          Shows the current model, its model ID, and the number of locally stored model sessions and messages.

          Example:
          ```text
          You: /current
          ```

          ### `/history`
          Displays the messages exchanged in the current model session. This is useful for reviewing the current conversation without opening saved files.

          Example:
          ```text
          You: /history
          ```

          ### `/clear`
          Starts a fresh conversation for the currently selected model. It does not delete conversations that were already saved with `/save`.

          Example:
          ```text
          You: /clear
          ```

          ### `/save`
          Saves the current conversation locally. If no name is supplied, the chatbot asks you for one.

          Examples:
          ```text
          You: /save
          Save conversation as: my-project
          ```

          ```text
          You: /save my-project
          ```

          Saved conversations are stored in the configured `CHATBOT_STORAGE_DIR` directory as local JSON files.

          ### `/load`
          Loads a previously saved conversation and restores it using the model stored with that conversation.

          Examples:
          ```text
          You: /load
          Load conversation: my-project
          ```

          ```text
          You: /load my-project
          ```

          ### `/saves`
          Lists the names of conversations currently saved locally.

          Example:
          ```text
          You: /saves
          ```

          ### `/file`
          Sends a local source-code or text file to the AI as context for analysis. The chatbot does not execute the supplied file.

          Supported examples include Python, JavaScript, TypeScript, Java, C/C++, C#, Go, Rust, PHP, Ruby, Kotlin, Swift, Dart, SQL, HTML, CSS, JSON, XML, YAML, TOML, Markdown, PowerShell, Bash, Vue, Svelte, Astro, and other configured text/source formats.

          The current file-input limit is **512 KB** and files must be readable as UTF-8 text.

          Examples:
          ```text
          You: /file
          File path: C:\Projects\app.py
          ```

          ```text
          You: /file C:\Projects\app.py
          ```

          ### `/exit`
          Safely exits the chatbot.

          Example:
          ```text
          You: /exit
          ```

          ## Typical workflow

          A simple first-time workflow is:

          ```text
          1. Configure .env
          2. Run: python app.py
          3. Ask a coding question
          4. Use /file PATH when code needs analysis
          5. Use /save NAME to preserve the conversation
          6. Use /load NAME to continue it later
          7. Use /model to switch Gemini models
          8. Use /exit when finished
          ```

          ## Important behavior

          - Model sessions are kept separately, so switching models does not automatically destroy the previous model session.
          - Saved conversations are local and are not committed to Git.
          - `/clear` clears only the active model's current session; it does not remove saved conversations.
          - File input provides the file as analysis context and does not execute the file.
          - Gemini/API errors are converted into user-friendly error categories instead of automatically retrying quota failures.
          - Never put a real `GEMINI_API_KEY` into the repository or release bundle.

          ## Web interface

          The v2.0 web interface provides browser-based chat, Gemini model switching, conversation history, clearing, save/load support, and the corresponding JSON API endpoints.

          ## Release assets

          This release contains:
          1. **AI-Chatbot-$TAG-bundle.zip** — application-only runtime bundle
          2. **Source code (zip)** — GitHub-generated repository snapshot
          3. **Source code (tar.gz)** — GitHub-generated repository snapshot
          4. **Release attestation** — GitHub-generated release provenance/attestation

          ## Notes

          This release is built from the **AI-Chatbot** branch. The runtime bundle is intentionally separated from repository-only files and workflows.
          EOF

          echo "Generated complete release notes:"
          cat "$NOTES"

      - name: Create or prepare release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="$GITHUB_REF_NAME"
          NOTES="$RUNNER_TEMP/ai-chatbot-release-notes.md"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IMMUTABLE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.immutable // false')"

            if [[ "$IMMUTABLE" == "true" ]]; then
              echo "Release $TAG is already immutable."
              echo "The runtime bundle and release metadata cannot be changed."
              echo "The generated release notes are preserved in the workflow logs."
              echo "can_mutate=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            gh release edit "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "$TAG :- AI Chatbot Release"               --notes-file "$NOTES"               --draft=true
          else
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "$TAG :- AI Chatbot Release"               --notes-file "$NOTES"               --draft
          fi

          echo "can_mutate=true" >> "$GITHUB_OUTPUT"

      - name: Upload AI Chatbot runtime bundle to release
        if: steps.release.outputs.can_mutate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$RUNNER_TEMP/ai-chatbot-release/AI-Chatbot-$GITHUB_REF_NAME-bundle.zip"
          test -f "$ZIP"

          gh release upload "$GITHUB_REF_NAME"             "$ZIP#AI Chatbot runtime bundle"             --repo "$GITHUB_REPOSITORY"             --clobber

      - name: Publish release
        if: steps.release.outputs.can_mutate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release edit "$GITHUB_REF_NAME"             --repo "$GITHUB_REPOSITORY"             --draft=false
