name: "CodeQL"

on:
  push:
    branches: [ "master", "feature-1" ]
    paths-ignore:
      - '.devcontainers/**'
      - '.vendor/**'
  pull_request:
    branches: [ "master", "feature-1" ]
    paths-ignore:
      - '.devcontainers/**'
      - '.vendor/**'
  schedule:
    - cron: '0 2 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'python' ] # Adjust languages according to your repository

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools and links your custom config file
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Points to your custom exclusions config file
        config-file: ./.github/codeql/config.config

    # Autobuild attempts to build any compiled languages (C/C++, C#, Go, Java, etc.)
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    # Performs the actual analysis and uploads SARIF results
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
