name: AI Chatbot Tag and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to create (for example 2.1)"
        required: true
        type: string
      release_title:
        description: "Optional release title"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ai-chatbot-manual-release
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag name
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TAG_NAME" || "$TAG_NAME" == -* || "$TAG_NAME" == *[[:space:]]* ]]; then
            echo "Invalid tag name. Enter a simple tag such as 2.1 or v2.1."
            exit 1
          fi
          if [[ ! "$TAG_NAME" =~ ^[A-Za-z0-9._/-]+$ || "$TAG_NAME" == *..* || "$TAG_NAME" == */ || "$TAG_NAME" == *.lock ]]; then
            echo "Tag name contains unsupported characters."
            exit 1
          fi

      - name: Checkout AI-Chatbot source
        uses: actions/checkout@v6
        with:
          ref: AI-Chatbot
          fetch-depth: 0

      - name: Ensure tag does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag '$TAG_NAME' already exists. Choose a new tag name."
            exit 1
          fi

      - name: Create annotated tag on AI-Chatbot commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          TAG_OBJECT="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG_NAME" \
            -f message="AI-Chatbot $TAG_NAME" \
            -f object="$SOURCE_SHA" \
            -f type=commit --jq .sha)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG_NAME" \
            -f sha="$TAG_OBJECT"
          echo "Created tag $TAG_NAME at AI-Chatbot commit $SOURCE_SHA"

      - name: Build runtime bundle
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="$RUNNER_TEMP/ai-chatbot-release"
          ROOT="$BUNDLE_DIR/AI-Chatbot-$TAG_NAME"
          ZIP="$BUNDLE_DIR/AI-Chatbot-$TAG_NAME-bundle.zip"
          rm -rf "$BUNDLE_DIR"
          mkdir -p "$ROOT"
          cp app.py web_app.py config.py conversation_store.py requirements.txt .env.example "$ROOT"/
          cp -R templates static "$ROOT"/
          (cd "$BUNDLE_DIR" && zip -qr "$(basename "$ZIP")" "$(basename "$ROOT")")
          test -f "$ZIP"
          echo "BUNDLE_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Create draft release and upload bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_TITLE_INPUT: ${{ inputs.release_title }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="$RELEASE_TITLE_INPUT"
          if [[ -z "$TITLE" ]]; then TITLE="$TAG_NAME :- AI Chatbot Release"; fi
          NOTES="$(mktemp)"
          cat > "$NOTES" <<EOF
          # AI Chatbot $TAG_NAME

          This release was built from the `AI-Chatbot` branch.

          ## Runtime bundle
          Download **AI-Chatbot-$TAG_NAME-bundle.zip** from Assets. It contains the runtime application files only: `app.py`, `web_app.py`, `config.py`, `conversation_store.py`, `requirements.txt`, `.env.example`, `templates/`, and `static/`.

          ## Run
          1. Extract the ZIP.
          2. Create and activate a Python virtual environment.
          3. Install dependencies with `python -m pip install -r requirements.txt`.
          4. Copy `.env.example` to `.env` and set your private `GEMINI_API_KEY`.
          5. Run `python app.py` or `python web_app.py`.

          Keep API keys private. Do not commit your real `.env` file.
          EOF
          gh release create "$TAG_NAME" "$BUNDLE_PATH#AI Chatbot runtime bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            --draft
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
