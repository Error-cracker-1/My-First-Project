name: AI Chatbot Tag and Release

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to create (for example 2.1)"
        required: true
        type: string
      release_title:
        description: "Optional AI-generated title override"
        required: false
        type: string
      release_description:
        description: "Optional release description override; otherwise Gemini writes it"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ai-chatbot-manual-release
  cancel-in-progress: false

jobs:
  tag-and-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag name
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TAG_NAME" || "$TAG_NAME" == -* || "$TAG_NAME" == *[[:space:]]* ]]; then
            echo "Invalid tag name. Enter a simple tag such as 2.1 or v2.1."
            exit 1
          fi
          if [[ ! "$TAG_NAME" =~ ^[A-Za-z0-9._-]+$ || "$TAG_NAME" == *..* || "$TAG_NAME" == */ || "$TAG_NAME" == *.lock ]]; then
            echo "Tag name contains unsupported characters."
            exit 1
          fi

      - name: Checkout AI-Chatbot source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'AI-Chatbot' || github.ref }}
          fetch-depth: 0

      - name: Ensure tag does not already exist
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag '$TAG_NAME' already exists. Choose a new tag name."
            exit 1
          fi

      - name: Create annotated tag on AI-Chatbot commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          TAG_OBJECT="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG_NAME" \
            -f message="AI-Chatbot $TAG_NAME" \
            -f object="$SOURCE_SHA" \
            -f type=commit --jq .sha)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG_NAME" \
            -f sha="$TAG_OBJECT"
          echo "Created tag $TAG_NAME at AI-Chatbot commit $SOURCE_SHA"

      - name: Build runtime bundle
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="$RUNNER_TEMP/ai-chatbot-release"
          ROOT="$BUNDLE_DIR/AI-Chatbot-$TAG_NAME"
          ZIP="$BUNDLE_DIR/AI-Chatbot-$TAG_NAME-bundle.zip"
          rm -rf "$BUNDLE_DIR"
          mkdir -p "$ROOT"
          cp app.py web_app.py config.py conversation_store.py requirements.txt .env.example "$ROOT"/
          cp -R templates static "$ROOT"/
          (cd "$BUNDLE_DIR" && zip -qr "$(basename "$ZIP")" "$(basename "$ROOT")")
          test -f "$ZIP"
          echo "BUNDLE_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Generate AI release title and description when missing
        id: release_text
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          TITLE_INPUT: ${{ inputs.release_title }}
          DESCRIPTION_INPUT: ${{ inputs.release_description }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$TITLE_INPUT" && -n "$DESCRIPTION_INPUT" ]]; then
            printf '%s' "$TITLE_INPUT" > "$RUNNER_TEMP/release-title.txt"
            printf '%s' "$DESCRIPTION_INPUT" > "$RUNNER_TEMP/release-description.md"
          else
            if [[ -z "${GEMINI_API_KEY:-}" ]]; then
              echo "::error::Set the GEMINI_API_KEY repository Actions secret to generate missing release title/description with Gemini."
              exit 1
            fi
            MODEL="${GEMINI_MODEL:-gemini-2.5-flash}"
            COMMITS="$(git log --pretty=format:'- %s (%h)' -n 40)"
            [[ -n "$COMMITS" ]] || COMMITS="No commit messages were available."
            PROMPT="$(printf '%s\\n' \
              'You are the release-note writer for the AI-Chatbot software repository. Produce accurate, polished release metadata based only on the supplied commit messages.' \
              'Do not invent features, fixes, compatibility claims, or security claims. If the evidence is vague, say so plainly.' \
              'Return ONLY valid JSON with exactly two string properties: title and description.' \
              'The title should be concise and specific, and must not repeat the tag unnecessarily.' \
              'The Markdown description should explain user-visible changes, improvements, fixes, and limitations inferable from the commit messages.' \
              "Mention that this is AI Chatbot release $TAG_NAME." \
              'Include a runtime bundle section listing app.py, web_app.py, config.py, conversation_store.py, requirements.txt, .env.example, templates/, and static/.' \
              'Do not include secrets.' \
              '' \
              "Tag: $TAG_NAME" \
              'Recent commit messages:' \
              "$COMMITS")"
            jq -n --arg prompt "$PROMPT" '{contents:[{parts:[{text:$prompt}]}],generationConfig:{responseMimeType:"application/json",temperature:0.2}}' > "$RUNNER_TEMP/gemini-request.json"
            HTTP_CODE="$(curl -sS -o "$RUNNER_TEMP/gemini-response.json" -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -X POST "https://generativelanguage.googleapis.com/v1beta/models/$MODEL:generateContent?key=$GEMINI_API_KEY" \
              --data-binary @"$RUNNER_TEMP/gemini-request.json")"
            if [[ "$HTTP_CODE" != 2* ]]; then
              echo "::error::Gemini API request failed with HTTP $HTTP_CODE. Check GEMINI_API_KEY and GEMINI_MODEL."
              cat "$RUNNER_TEMP/gemini-response.json"
              exit 1
            fi
            AI_JSON="$(jq -er '.candidates[0].content.parts | map(.text // "") | join("")' "$RUNNER_TEMP/gemini-response.json")"
            AI_TITLE="$(printf '%s' "$AI_JSON" | jq -er '.title | strings | select(length > 0)')"
            AI_DESCRIPTION="$(printf '%s' "$AI_JSON" | jq -er '.description | strings | select(length > 0)')"
            printf '%s' "$AI_TITLE" > "$RUNNER_TEMP/release-title.txt"
            printf '%s' "$AI_DESCRIPTION" > "$RUNNER_TEMP/release-description.md"
            if [[ -z "$TITLE_INPUT" ]]; then TITLE_INPUT="$AI_TITLE"; fi
            if [[ -z "$DESCRIPTION_INPUT" ]]; then DESCRIPTION_INPUT="$AI_DESCRIPTION"; fi
            printf '%s' "$TITLE_INPUT" > "$RUNNER_TEMP/release-title.txt"
            printf '%s' "$DESCRIPTION_INPUT" > "$RUNNER_TEMP/release-description.md"
          fi
          echo "Release title prepared."

      - name: Create draft release and upload bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          RELEASE_TITLE_INPUT: ${{ inputs.release_title }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="$(cat "$RUNNER_TEMP/release-title.txt")"
          NOTES="$RUNNER_TEMP/release-description.md"
          if [[ "$EVENT_NAME" == "push" ]] && gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release already exists for tag $TAG_NAME; refusing to modify it."
            exit 1
          fi
          gh release create "$TAG_NAME" "$BUNDLE_PATH#AI Chatbot runtime bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            --draft
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
