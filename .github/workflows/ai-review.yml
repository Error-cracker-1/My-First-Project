name: Daily AI Review

on:
  push:
    branches:
      - AI-Chatbot
    paths-ignore:
      - "AI-Chatbot-Review/**"
      - "docs/**"

  workflow_dispatch:
    inputs:
      review_mode:
        description: "Choose review mode"
        required: true
        default: "modified"
        type: choice
        options:
          - modified
          - all

  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: write

# Prevent multiple AI-review runs from pushing review artifacts
# to AI-Chatbot at the same time. A newer run waits for the
# currently running review instead of cancelling it.
concurrency:
  group: ai-review-AI-Chatbot
  cancel-in-progress: false

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AI-Chatbot
        uses: actions/checkout@v4
        with:
          ref: AI-Chatbot
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Python
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai GitPython

      - name: Determine review mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DAY=$(date +%u)

            if [ "$DAY" -eq 7 ]; then
              echo "mode=all" >> $GITHUB_OUTPUT
            else
              echo "mode=modified" >> $GITHUB_OUTPUT
            fi
          else
            echo "mode=${{ github.event.inputs.review_mode }}" >> $GITHUB_OUTPUT
          fi

      - name: Display review mode
        run: |
          echo "=============================================="
          echo "Review Mode : ${{ steps.mode.outputs.mode }}"
          echo "=============================================="

      - name: Run AI Review
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python -m scripts.ai_review ${{ steps.mode.outputs.mode }}

      - name: Commit and push AI review artifacts
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d "AI-Chatbot-Review" ]; then
            git add AI-Chatbot-Review/
          fi

          if [ -d "docs" ]; then
            git add docs/
          fi

          if git diff --cached --quiet; then
            echo "No AI review artifacts to commit."
            exit 0
          fi

          git commit -m "docs: save AI review artifacts"

          # Another push can happen while the AI review is running.
          # Fetch the newest branch, rebase the review commit on it,
          # then retry the push if the remote moves again.
          for attempt in 1 2 3 4 5; do
            echo "=============================================="
            echo "AI review artifact push attempt: $attempt/5"
            echo "=============================================="

            git fetch origin AI-Chatbot

            if ! git rebase origin/AI-Chatbot; then
              echo "Rebase failed. Aborting rebase..."
              git rebase --abort || true
              echo "Waiting 5 seconds before retry..."
              sleep 5
              continue
            fi

            if git push origin HEAD:AI-Chatbot; then
              echo "AI review artifacts pushed successfully."
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "Remote branch changed during push."
              echo "Waiting 5 seconds before retry..."
              sleep 5
            fi
          done

          echo "Failed to push AI review artifacts after 5 attempts."
          exit 1
