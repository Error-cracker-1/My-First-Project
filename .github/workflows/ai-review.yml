name: Daily AI Review

on:
  workflow_dispatch:
    inputs:
      review_mode:
        description: "Choose review mode"
        required: true
        default: "modified"
        type: choice
        options:
          - modified
          - all

  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AI-Chatbot
        uses: actions/checkout@v4
        with:
          ref: AI-Chatbot
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Python
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai GitPython

      - name: Determine review mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DAY=$(date +%u)

            if [ "$DAY" -eq 7 ]; then
              echo "mode=all" >> $GITHUB_OUTPUT
            else
              echo "mode=modified" >> $GITHUB_OUTPUT
            fi
          else
            echo "mode=${{ github.event.inputs.review_mode }}" >> $GITHUB_OUTPUT
          fi

      - name: Display review mode
        run: |
          echo "=============================================="
          echo "Review Mode : ${{ steps.mode.outputs.mode }}"
          echo "=============================================="

      - name: Run AI Review
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python -m scripts.ai_review ${{ steps.mode.outputs.mode }}

      - name: Commit and push AI review artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d "AI-Chatbot-Review" ]; then
            git add AI-Chatbot-Review/
          fi

          if git diff --cached --quiet; then
            echo "No AI review artifacts to commit."
          else
            git commit -m "docs: save AI review artifacts"
            git push origin HEAD:AI-Chatbot
          fi