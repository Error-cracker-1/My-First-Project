name: Daily AI Review

on:
  workflow_dispatch:
    inputs:
      review_mode:
        description: "Choose review mode"
        required: true
        default: "modified"
        type: choice
        options:
          - modified
          - all

  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature-1
        uses: actions/checkout@v5
        with:
          ref: feature-1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Python
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai GitPython

      - name: Determine review mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=modified" >> $GITHUB_OUTPUT
          else
            echo "mode=${{ github.event.inputs.review_mode }}" >> $GITHUB_OUTPUT
          fi

      - name: Show review mode
        run: |
          echo "Review Mode: ${{ steps.mode.outputs.mode }}"

      - name: Run AI Review
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python -m scripts.ai_review ${{ steps.mode.outputs.mode }}