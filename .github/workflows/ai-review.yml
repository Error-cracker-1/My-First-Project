name: Daily AI Review

on:
  workflow_dispatch:

  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature-1
        uses: actions/checkout@v6
        with:
          ref: feature-1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify versions
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai GitPython

      - name: Run AI Review
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python -m scripts.ai_review